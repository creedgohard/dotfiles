# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃                    Variables Configuration                  ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

source = ~/.cache/wal/colors-hyprland.conf

# https://wiki.hyprland.org/Configuring/Variables/#general
# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    # 1. REMOVED the two rgba(00000000) lines
    # 2. ADDED Pywal accent colors here
    col.active_border = $color4 $color9 45deg
    col.inactive_border = $color9

    # Bumped to 2 for better visibility
    border_size = 1

    gaps_out = 5
    gaps_in = 5

    resize_on_border = true
    extend_border_grab_area = 20
    hover_icon_on_border = true
}

# removed old gestures {} block — Hyprland 0.39+ uses gesture = … lines

# https://wiki.hyprland.org/Configuring/Variables/#group
group {
    # Using Pywal colors instead of $cachydgreen, etc.
    col.border_active = $color4
    col.border_inactive = $color8
    col.border_locked_active = $color5
    col.border_locked_inactive = $color8

    groupbar {
        font_family = "Fira Sans"
        text_color = $foreground
        col.active = $color4
        col.inactive = $color8
        col.locked_active = $color5
        col.locked_inactive = $color8
    }
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    font_family = "Fira Sans"
    splash_font_family = "Fira Sans"
    # Using Pywal colors[cite: 19]
    col.splash = $color4
    background_color = $background
    enable_swallow = true
    swallow_regex = ^(nautilus|nemo|thunar|btrfs-assistant.)$
    focus_on_activate = true
    vrr = 2
}

# https://wiki.hyprland.org/Configuring/Variables/#render
render {
   direct_scanout = true
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    special_scale_factor = 0.8
    pseudotile = true
    preserve_split = true
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
    special_scale_factor = 0.8
}

# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃                    Gestures                                 ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

# 4-finger horizontal swipe to switch workspaces
gesture = 4, horizontal, workspace

# 3-finger swipe down closes active window
gesture = 3, down, close

# 3-finger swipe up toggles fullscreen
gesture = 3, up, fullscreen

# 3-finger swipe left toggles float/tile
gesture = 3, left, float
