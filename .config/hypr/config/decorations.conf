# ┃                    Decorations Configuration                ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛
source = ~/.config/hypr/config/colors.conf

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 0.80

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        xray = true
    }

    shadow {
    enabled = true
    range = 40
    render_power = 1
    color = rgba(00000000)
}
}
