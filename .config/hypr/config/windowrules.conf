# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃                    Windowrules Configuration                ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

# --- SIMPLE FLOATING RULES (Single effects only) ---
windowrule = match:class ^(org\.pulseaudio\.pavucontrol)$, float on
windowrule = match:class ^(blueman-manager)$, float on
windowrule = match:class ^(nm-connection-editor)$, float on
windowrule = match:class ^(CachyOSHello)$, float on
windowrule = match:class ^(zenity)$, float on
windowrule = match:class ^(imv|mpv|nemo)$, float on
windowrule = match:title ^(Save File)$, float on
windowrule = match:title ^(Open File)$, float on
#windowrule = float on, match:class ^(.*)$

# --- COMPLEX RULES (Using Braced Syntax to stop multiple-value errors) ---

windowrule {
    name = firefox-solid
    match:class = ^(firefox)$
    opacity = 1.0 override 1.0 override 1.0 override
}

windowrule {
    name = fullscreen-solid
    match:fullscreen = 1
    opacity = 1.0 override 1.0 override 1.0 override
}

windowrule {
    name = wlogout-corner
    match:class = ^(wlogout)$
    float = on
    monitor = DP-1
}

windowrule {
    name = pip-style
    match:title = ^(Picture-in-Picture)$
    float = on
    size = 960 540
    move = 75% 75%
}

# --- WLOGOUT FIX ---
# This stops the background from blurring and darkening
layerrule = blur on, match:namespace logout_dialog
layerrule = ignore_alpha 1.0, match:namespace logout_dialog
layerrule = no_anim on, match:namespace logout_dialog

windowrule = match:class ^(wlogout)$, opacity 0.9 0.8, stay_focused on

# Force wlogout to be a floating window in the corner
windowrule = float on, match:class wlogout
windowrule = move 20 1000, match:class wlogout
windowrule = size 200 400, match:class wlogout

# THE DIMMING FIX: This stops both screens from going dark
windowrule = no_dim on, match:class wlogout

# --- ANIMATIONS & WORKSPACES ---
windowrule = match:class ^(kitty|Alacritty)$, animation slide

workspace = w[tv1-10], gapsout:15, gapsin:5
workspace = f[1], gapsout:15, gapsin:5

# --- LAYER RULES (Strict match:namespace syntax) ---
layerrule = animation slide, match:namespace ^(waybar)$
layerrule = animation slide, match:namespace ^(logout_dialog)$
layerrule = ignore_alpha 1.0, match:namespace ^(logout_dialog)$

# wlogout — small floating box, bottom-left corner
windowrule = float on, match:class wlogout
windowrule = size 220 560, match:class wlogout
windowrule = move 20 (monitor_h-580), match:class wlogout
windowrule = no_blur on, match:class wlogout
windowrule = no_shadow on, match:class wlogout
windowrule = no_anim on, match:class wlogout


# Optional: If you want MO2 to float so it doesn't tile with the game
windowrule = match:class ^(steam_app_0)$, float on


# Apply the same 'match:class' logic to everything
#windowrule = float on, match:class ^(.*)$
#windowrule = center on, match:class ^(.*)$

#SWAYIMG
windowrule {
    name = swayimg-center
    match:class = ^swayimg.*
    float = on
    monitor = DP-1
    size = 1280 720
    center = on
    no_blur = on
    suppress_event = fullscreen maximize
}

# Calendar popup
windowrule = float on, match:class ^(waybar-calendar)$
windowrule = border_size 0, match:class ^(waybar-calendar)$
windowrule = no_shadow on, match:class ^(waybar-calendar)$
windowrule = no_blur on, match:class ^(waybar-calendar)$

windowrule {
    name = calendar-grow-anim
    match:class = waybar-calendar
    animation = popin
    # NO SPACES in the math!
    move = (cursor_x-(window_w*0.5)) (cursor_y-window_h)
}

# Sysinfo popup
windowrule = float on, match:class ^(waybar-sysinfo)$
windowrule = border_size 0, match:class ^(waybar-sysinfo)$
windowrule = no_shadow on, match:class ^(waybar-sysinfo)$
windowrule = no_blur on, match:class ^(waybar-sysinfo)$

windowrule {
    name = sysinfo-grow-anim
    match:class = waybar-sysinfo
    animation = popin
    # NO SPACES in the math!
    move = (cursor_x-(window_w*0.5)) cursor_y
}

# Media Player Popup
windowrule = float on, match:class ^(waybar-mediaplayer)$
windowrule = border_size 0, match:class ^(waybar-mediaplayer)$
windowrule = no_shadow on, match:class ^(waybar-mediaplayer)$
windowrule = no_blur on, match:class ^(waybar-mediaplayer)$

windowrule {
    name = media-grow-anim
    match:class = waybar-mediaplayer
    animation = popin
    # NO SPACES in math for 0.54 compatibility!
    move = (cursor_x-(window_w*0.5)) cursor_y
}



windowrule {
    name = volume-popup
    match:class = waybar-volume
    animation = popin
    float = on
    move = (cursor_x-(window_w*0.5)) (cursor_y-window_h)
}


# Skyrim SE - precise targeting
windowrule = content game, match:initial_class ^(steam_app_489830)$
windowrule = fullscreen on, match:initial_class ^(steam_app_489830)$
windowrule = immediate on, match:initial_class ^(steam_app_489830)$
windowrule = no_blur on, match:initial_class ^(steam_app_489830)$
windowrule = no_dim on, match:initial_class ^(steam_app_489830)$
windowrule = no_shadow on, match:initial_class ^(steam_app_489830)$
windowrule = suppress_event fullscreen maximize, match:initial_class ^(steam_app_489830)$
windowrule = idle_inhibit always, match:initial_class ^(steam_app_489830)$


