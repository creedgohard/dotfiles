# ┃                      Input Configuration                    ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

# Input wiki https://wiki.hyprland.org/Configuring/Variables/#input
input {
    # ... your existing kb_layout, etc ...

    sensitivity = 0.0 # 0.0 means no modification to the raw input
    accel_profile = flat # This is the "Force Off" for acceleration
    force_no_accel = false # Keep this false; setting it to true can cause desync

    # Set keyboard layout to United Kingdom
    kb_layout = gb

    # Optional: If you need specific variants (like Mac or Dvorak)
    # kb_variant =

    # Keeps your other settings (sensitivity, follow_mouse, etc.)
    follow_mouse = 1
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification

    accel_profile = flat
    force_no_accel = true
}
