# ┃                    Animations Configuration                 ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

# https://wiki.hyprland.org/Configuring/Animations/

animations {
    enabled = yes
    bezier = overshot, 0.13, 0.99, 0.29, 1.1
    bezier = fluid, 0.1, 1.1, 0.1, 1.05  # Add this for the popups

    animation = windowsIn, 1, 15, fluid, slide bottom
    animation = windowsOut, 1, 15, fluid, slide top
    # ... rest of your config

    animation = windowsIn, 1, 6, overshot, slide
}

animations {
    enabled = yes
    bezier = overshot, 0.13, 0.99, 0.29, 1.1
    # Change the '4' to a '6' for a smoother glide
    animation = windowsIn, 1, 6, overshot, slide
    animation = windowsOut, 1, 5, default, popin 80%
    animation = border, 1, 5, default
    animation = workspacesIn, 1, 6, overshot, slide
}

