source = $HOME/.cache/wal/colors-hyprland.conf

background {
    monitor =
    # Point it to our new dedicated symlink
    path = /home/creed/.cache/wal/lockscreen.png

    # Privacy settings
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.7
    vibrancy = 0.1696
}

input-field {
    monitor =
    size = 200, 50
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    outer_color = $color1
    inner_color = $background
    font_color = $foreground
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = $foreground
    font_size = 64
    font_family = Hack Nerd Font
    position = 0, 80
    halign = center
    valign = center
}
