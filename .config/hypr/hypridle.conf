general {
    lock_cmd = pidof hyprlock || hyprlock       # dbus/sysd lock command (called by loginctl)
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # turn on display after sleep
}

listener {
    timeout = 300                                # 5 mins
    on-timeout = loginctl lock-session           # lock screen
}

listener {
    timeout = 330                                # 5.5 mins
    on-timeout = hyprctl dispatch dpms off       # monitor power save
    on-resume = hyprctl dispatch dpms on         # monitor wake
}

